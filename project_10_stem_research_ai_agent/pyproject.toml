[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-research-ai-agent"
version = "0.1.0"
description = "Human-in-the-loop STEM research agent"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<2", "scipy>=1.10,<1.15", "scikit-learn>=1.4,<1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
