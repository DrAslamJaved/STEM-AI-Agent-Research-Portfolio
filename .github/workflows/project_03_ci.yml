name: Project 03 CI

on:
  push:
    branches:
      - main
    paths:
      - "project_03_time_series_agent/**"
      - ".github/workflows/project_03_ci.yml"

  pull_request:
    paths:
      - "project_03_time_series_agent/**"
      - ".github/workflows/project_03_ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    defaults:
      run:
        working-directory: project_03_time_series_agent

    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: project_03_time_series_agent/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Compile Python files
        run: python -m compileall src tests scripts

      - name: Run test suite with coverage
        run: |
          python -m pytest \
            --cov=src/time_series_agent \
            --cov-report=term-missing \
            --cov-report=xml:reports/validation/coverage.xml \
            --junitxml=reports/validation/ci_pytest.xml \
            --cov-fail-under=90 \
            -W error::DeprecationWarning

      - name: Test module command
        run: python -m time_series_agent --help

      - name: Inspect complete workflow safely
        run: python -m time_series_agent run-all --dry-run

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-03-validation-python-${{ matrix.python-version }}
          path: |
            project_03_time_series_agent/reports/validation/ci_pytest.xml
            project_03_time_series_agent/reports/validation/coverage.xml
          if-no-files-found: warn
          retention-days: 14