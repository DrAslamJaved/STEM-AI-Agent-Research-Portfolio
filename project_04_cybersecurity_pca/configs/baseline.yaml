project:
  name: "Agentic Cybersecurity Anomaly Detection Using PCA and Eigenvalue Analysis"
  random_seed: 42
  anomaly_label: 1
  normal_label: 0

pca:
  explained_variance_target: 0.95
  eigenvalue_tolerance: 1.0e-12
  covariance_denominator: "n_minus_1"
  eigensolver: "numpy.linalg.eigh"
  reconstruction_space: "standardized"
  reconstruction_error: "mean_squared_error"
  fitting_split: "normal_fit_only"
  component_selection_rule: "minimum_cumulative_explained_variance"
  refit_selected_model: true
  score_splits:
    - "normal_fit"
    - "normal_calibration"
    - "test"
  excluded_columns:
    - "flow_id"
    - "is_anomaly"
    - "scenario"

threshold:
  fitting_class: "normal_only"
  calibration_class: "normal_only"
  method: "quantile"
  quantile: 0.99
  comparison: "strictly_greater_than"

data:
  development_dataset: "deterministic_synthetic_network_flows"
  final_dataset: "UNSW-NB15"
  raw_data_immutable: true
  test_labels_hidden_until_evaluation: true

evaluation:
  positive_class: "anomaly"
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "confusion_matrix"
    - "false_positive_rate"
    - "false_negative_rate"

synthetic_data:
  normal_observations: 4000
  attack_observations_per_type: 250
  attack_types:
    - "port_scan"
    - "dos"
    - "brute_force"
    - "exfiltration"
  shuffle: true
  output_dtype: "float64"
  id_column: "flow_id"
  label_column: "is_anomaly"
  scenario_column: "scenario"
  feature_columns:
    - "duration_ms"
    - "packets_in"
    - "packets_out"
    - "bytes_in"
    - "bytes_out"
    - "syn_count"
    - "ack_count"
    - "connection_rate"
    - "unique_dest_ports"
    - "failed_logins"

preprocessing:
  normal_fit_fraction: 0.60
  normal_calibration_fraction: 0.20
  normal_test_fraction: 0.20
  random_seed: 42
  fitting_class: "normal_only"
  calibration_class: "normal_only"
  attack_assignment: "test_only"
  shuffle_test_split: true
  standardizer: "sklearn.preprocessing.StandardScaler"
  scaler_fit_split: "normal_fit_only"
  scaler_variance_ddof: 0
  excluded_columns:
    - "flow_id"
    - "is_anomaly"
    - "scenario"
  reject_zero_variance: true
  preserve_flow_ids: true
