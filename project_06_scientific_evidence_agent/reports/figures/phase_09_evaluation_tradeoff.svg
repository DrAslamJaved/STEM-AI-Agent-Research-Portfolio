<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 424" width="820" height="424" role="img" aria-label="Phase 8 audited-agent versus direct-RAG trade-off">
  <title>Phase 8 audited-agent vs direct-RAG trade-off</title>
  <rect x="0" y="0" width="820" height="424" fill="#ffffff" />
  <text x="16" y="28" font-size="18" font-weight="700" fill="#111111">Phase 8 evaluation trade-off: audited agent vs. direct RAG</text>
  <text x="16" y="50" font-size="14" font-weight="700" fill="#8a1f1f">Held-out development evaluation — not an independent test.</text>
  <text x="16" y="70" font-size="12" fill="#444444">300 held-out development claims. Both arms consumed the same frozen runtime trace.</text>
  <rect x="260" y="80" width="14" height="14" fill="#2f6f9f" />
  <text x="280" y="91" font-size="12" fill="#1a1a1a">Direct RAG</text>
  <rect x="370" y="80" width="14" height="14" fill="#c9722c" />
  <text x="390" y="91" font-size="12" fill="#1a1a1a">Audited agent</text>
    <text x="16" y="118.0" font-size="14" font-weight="600" fill="#1a1a1a">Coverage (not abstained)</text>
    <rect x="260" y="96.0" width="330.4" height="22" fill="#2f6f9f" /><text x="598.4" y="111.4" font-size="13" fill="#1a1a1a">Direct RAG: 1.000</text>
    <rect x="260" y="124.0" width="159.7" height="22" fill="#c9722c" /><text x="427.7" y="139.4" font-size="13" fill="#1a1a1a">Audited agent: 0.483</text>
    <text x="260" y="162.0" font-size="12" fill="#444444">The audited agent trades coverage for citation discipline: it abstains far more often than direct RAG.</text>
    <text x="16" y="214.0" font-size="14" font-weight="600" fill="#1a1a1a">Abstract-level F1 (official SciFact)</text>
    <rect x="260" y="192.0" width="316.7" height="22" fill="#2f6f9f" /><text x="584.7" y="207.4" font-size="13" fill="#1a1a1a">Direct RAG: 0.1925</text>
    <rect x="260" y="220.0" width="92.9" height="22" fill="#c9722c" /><text x="360.9" y="235.4" font-size="13" fill="#1a1a1a">Audited agent: 0.0565</text>
    <text x="260" y="258.0" font-size="12" fill="#444444">Δ -0.1360  95% CI [-0.1871, -0.0870]</text>
    <text x="16" y="310.0" font-size="14" font-weight="600" fill="#1a1a1a">Sentence-level F1 (official SciFact)</text>
    <rect x="260" y="288.0" width="171.5" height="22" fill="#2f6f9f" /><text x="439.5" y="303.4" font-size="13" fill="#1a1a1a">Direct RAG: 0.1043</text>
    <rect x="260" y="316.0" width="70.4" height="22" fill="#c9722c" /><text x="338.4" y="331.4" font-size="13" fill="#1a1a1a">Audited agent: 0.0428</text>
    <text x="260" y="354.0" font-size="12" fill="#444444">Δ -0.0614  95% CI [-0.0946, -0.0288]</text>
  <text x="16" y="410.0" font-size="11" fill="#666666">A positive delta is not a blanket superiority claim; interpret alongside coverage and faithfulness.</text>
</svg>
