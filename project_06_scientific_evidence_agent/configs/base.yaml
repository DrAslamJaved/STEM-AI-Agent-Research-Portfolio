project:
  name: scientific_evidence_agent
  seed: 20260904

data:
  raw_dir: data/raw/scifact
  require_cross_validation: true

retrieval:
  algorithm: bm25
  b: 0.75
  corpus_path: data/raw/scifact/data/corpus.jsonl
  index_path: artifacts/scifact_bm25_index.json
  k1: 1.2
  report_path: results/retrieval_baseline_dev.json

hybrid_retrieval:
  baseline_report_path: results/retrieval_baseline_dev.json
  candidate_k: 50
  corpus_path: data/raw/scifact/data/corpus.jsonl
  report_path: results/hybrid_retrieval_dev.json
  rrf_rank_constant: 60
  semantic_index_path: artifacts/scifact_lsa_index.joblib
  semantic_min_document_frequency: 2
  semantic_n_components: 128
  semantic_random_seed: 20260904

runtime:
  max_retrieved_documents: 10
  max_citations_per_decision: 3
  abstain_below_confidence: 0.45

verification:
  algorithm: tfidf_relation_features_logistic_regression
  assertion_threshold: 0.45
  corpus_path: data/raw/scifact/data/corpus.jsonl
  development_claims_path: data/raw/scifact/data/claims_dev.jsonl
  max_features: 40000
  max_sentences_per_citation: 2
  model_path: artifacts/scifact_lexical_verifier.joblib
  random_seed: 20260904
  report_path: results/verification_dev.json
  retrieval_k: 10
  sentence_threshold: 0.50
  trace_path: artifacts/verification_dev_trace.json
  training_claims_path: data/raw/scifact/data/claims_train.jsonl

citation_audit:
  algorithm: cross_validated_confidence_and_citation_filter
  artifact_dir: artifacts/citation_audit_cv
  assertion_thresholds: [0.45, 0.55, 0.65, 0.75, 0.85, 0.95]
  calibration_report_path: results/citation_audit_cross_validation.json
  corpus_path: data/raw/scifact/data/corpus.jsonl
  cross_validation_dir: data/raw/scifact/data/cross_validation
  development_claims_path: data/raw/scifact/data/claims_dev.jsonl
  evaluation_report_path: results/citation_audit_dev.json
  evaluation_trace_path: artifacts/citation_audit_dev_trace.json
  max_features: 40000
  max_sentences_per_citation: [1, 2]
  minimum_coverage: 0.20
  random_seed: 20260904
  retrieval_k: 10
  sentence_thresholds: [0.50, 0.60, 0.70, 0.80, 0.90]
  training_claims_path: data/raw/scifact/data/claims_train.jsonl

evaluation:
  retrieval_cutoffs: [1, 3, 5, 10]
  final_split: dev
  report_bootstrap_confidence_intervals: true
