[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-01-fuzzy-similarity"
version = "0.1.0"
description = "Reproducible implementation for Project 1's approved fuzzy similarity subfamily"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
