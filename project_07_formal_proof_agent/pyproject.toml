[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-proof-agent"
version = "0.1.0"
description = "Formal Mathematical Proof and Counterexample Agent"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "sympy>=1.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"